services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      - SOVEREIGN_MODE=true

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./chroma:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
